[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragflow-mcp"
version = "0.1.0"
description = "Local RAG knowledge base exposed through Model Context Protocol tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp[cli]>=1.2.0", "numpy>=1.26", "sentence-transformers>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ragflow-mcp = "ragflow_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
